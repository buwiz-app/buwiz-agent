[package]
name = "buwiz-agent"
version = "0.1.0"
description = "Shared types for Buwiz mini apps: UI targets, context refs, operations, and the caller and approval rules"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[[bin]]
name = "buwiz-agent-gen"
path = "src/bin/gen.rs"

[dependencies]
# The generators are pinned exactly: a new version can change the generated
# files, and that should be a deliberate edit here, not a lockfile refresh.
schemars = "=1.2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "=12.0.1", features = ["no-serde-warnings"] }

[lints]
workspace = true
